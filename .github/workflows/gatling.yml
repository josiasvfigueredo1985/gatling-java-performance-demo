name: Gatling performance tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL you are authorized to load-test (HTTP/HTTPS)"
        required: true
        type: string
        default: https://api-ecomm.gatling.io
      test_type:
        description: Test type (simulation class)
        required: true
        type: choice
        default: LoadTest
        options:
          - LoadTest
          - StressTest
          - SpikeTest
          - EnduranceTest
          - ScalabilityTest
          - VolumeTest
      configuration:
        description: Performance configuration
        required: true
        type: choice
        default: load
        options:
          - load
          - stress
          - spike
          - endurance
          - scalability
          - volume
      quick:
        description: Use quick duration overrides (10-second test, 5-second ramp)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gatling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_artifact_id: ${{ steps.upload-pages.outputs.artifact_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate target URL
        env:
          BASE_URL: ${{ inputs.base_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          url = os.environ["BASE_URL"]
          try:
              parsed = urlsplit(url)
              port = parsed.port
              valid = (
                  parsed.scheme in ("http", "https")
                  and parsed.hostname
                  and not parsed.username
                  and not parsed.password
                  and not parsed.query
                  and not parsed.fragment
                  and not any(char.isspace() or ord(char) < 32 or ord(char) == 127 for char in url)
              )
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit("::error::Provide an HTTP/HTTPS base URL without credentials, query, fragment, or whitespace.")
          PY

      - name: Run Gatling
        env:
          BASE_URL: ${{ inputs.base_url }}
          SIMULATION: ${{ inputs.test_type }}
          TEST_CONFIG: ${{ inputs.configuration }}
          QUICK: ${{ inputs.quick }}
        shell: bash
        run: |
          chmod +x mvnw
          args=(
            --batch-mode
            --no-transfer-progress
            --settings settings.xml
            clean gatling:test
            "-Dgatling.simulationClass=example.$SIMULATION"
            "-DtestConfig=$TEST_CONFIG"
            "-DbaseUrl=$BASE_URL"
            "-Dgatling.resultsFolder=$GITHUB_WORKSPACE/results"
          )
          if [[ "$QUICK" == "true" ]]; then
            args+=(-DoverrideTestDuration=10 -DoverrideRampDuration=5)
          fi
          ./mvnw "${args[@]}"

      - name: Upload Gatling results
        id: upload-results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: gatling-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 7

      - name: Print download URL
        if: ${{ always() }}
        env:
          REPORT_URL: ${{ steps.upload-results.outputs.artifact-url }}
        shell: bash
        run: |
          if [[ -n "$REPORT_URL" ]]; then
            echo "Gatling report download: $REPORT_URL"
            printf '### Gatling report\n\n[Download report](%s)\n\nExtract the artifact and open `index.html` in the simulation folder.\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No report artifact was uploaded. Check the preceding steps for errors."
            printf '### Gatling report\n\nNo report artifact was uploaded. Check the preceding steps for errors.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare browser report
        id: prepare-report
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil

          reports = list(Path("results").glob("*/index.html"))
          if not reports:
              print("::warning::No HTML report was generated; the published report will not be replaced.")
          elif len(reports) != 1:
              raise SystemExit("::error::Expected exactly one Gatling HTML report.")
          else:
              site = Path(os.environ["RUNNER_TEMP"]) / "gatling-report"
              shutil.copytree(reports[0].parent, site)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"path={site.as_posix()}\n")
                  output.write("available=true\n")
          PY

      - name: Upload browser report
        id: upload-pages
        if: ${{ always() && steps.prepare-report.outputs.available == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.prepare-report.outputs.path }}

  publish-report:
    needs: gatling
    if: ${{ !cancelled() && needs.gatling.outputs.pages_artifact_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print report URL
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          echo "Open Gatling report: $REPORT_URL"
          printf '### Gatling report\n\n[Open report](%s)\n\nThis public page shows the latest published report and is replaced by the next publication.\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
